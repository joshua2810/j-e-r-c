    <form method="post">
        <label>Nombre</label>
        <input type="text" name="nombre" placeholder="Escribe tu nombre..." required>
        <br><br>

        <label>Apellido Paterno</label>
        <input type="text" name="apellido_p" placeholder="Escribe tu apellido paterno..." required>
        <br><br>

        <label>Apellido Materno</label>
        <input type="text" name="apellido_m" placeholder="Escribe tu apellido materno..." >
        <br><br>

        <label>Edad</label>
        <input type="number" name="Edad" min="14" max="20" placeholder="Escribe tu edad..." required>
        <br><br>

        <label>Genero</label>
        <input type="radio" name="genero" value="Femenino"> Femenino
        <input type="radio" name="genero" value="Masculino"> Masculino
        <br><br>

        <label>Intereses</label>
        <input type="checkbox" name="Intereses" value="Futbol"> Futbol
        <input type="checkbox" name="Intereses" value="Basquetbol"> Basquetbol
        <input type="checkbox" name="Intereses" value="Videojuegos"> Videojuegos
        <input type="checkbox" name="Intereses" value="Musica"> Musica
        <br><br>

        <button type="submit"> Guardar </button>
    </form>
